<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" shape-rendering="crispEdges">
  <!-- Left Face (Boy) -->
  <g transform="translate(2, 2)">
    <rect x="2" y="2" width="18" height="24" fill="#D35400" stroke="#111111" stroke-width="2" />
    <rect x="4" y="6" width="14" height="18" fill="#F5CBA7" />
    <rect x="4" y="4" width="5" height="4" fill="#D35400" />
    <rect x="13" y="4" width="5" height="4" fill="#D35400" />
    <!-- Eyes -->
    <rect x="6" y="11" width="3" height="4" fill="#111111" />
    <rect x="13" y="11" width="3" height="4" fill="#111111" />
    <!-- Mouth -->
    <rect x="9" y="18" width="4" height="2" fill="#BA4A00" />
  </g>
  <!-- Right Face (Girl/Friend) -->
  <g transform="translate(24, 2)">
    <rect x="2" y="2" width="18" height="24" fill="#873600" stroke="#111111" stroke-width="2" />
    <rect x="4" y="6" width="14" height="18" fill="#FADBD8" />
    <rect x="4" y="4" width="14" height="4" fill="#873600" />
    <!-- Eyes -->
    <rect x="6" y="11" width="3" height="4" fill="#111111" />
    <rect x="13" y="11" width="3" height="4" fill="#111111" />
    <!-- Mouth -->
    <rect x="9" y="18" width="4" height="2" fill="#C0392B" />
  </g>
</svg>
